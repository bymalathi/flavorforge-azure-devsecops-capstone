trigger:
- main


pool:
  vmImage: ubuntu-latest


variables:

  aksResourceGroup: flavorforge-rg
  aksClusterName: flavorforge-aks



stages:


- stage: ArgoCDDeploy

  displayName: "ArgoCD GitOps Deployment"


  jobs:


  - job: Deploy

    displayName: "Apply ArgoCD Application"


    steps:


    - checkout: self



    - task: AzureCLI@2

      displayName: "Connect to AKS"


      inputs:

        connectedServiceNameARM: flavorforge-azure-sc

        scriptType: bash

        scriptLocation: inlineScript


        inlineScript: |


          az aks get-credentials \
          --resource-group $(aksResourceGroup) \
          --name $(aksClusterName) \
          --overwrite-existing


          kubectl get nodes



    - bash: |

        echo "Applying ArgoCD Application"


        kubectl apply -f argocd/application.yaml



      displayName: "Create ArgoCD App"



    - bash: |

        echo "ArgoCD Applications"

        kubectl get applications -n argocd


        echo "Production Pods"

        kubectl get pods -n flavorforge-prod


      displayName: "Verify Deployment"