apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flavorforge-prod
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/shettymalathib/flavorforge-azure-devsecops-capstone.git
    targetRevision: main
    path: kubernetes/overlays/prod


  destination:
    server: https://kubernetes.default.svc
    namespace: flavorforge-prod


  syncPolicy:

    automated:
      prune: true
      selfHeal: true