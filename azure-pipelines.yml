trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: "Build Application"

  jobs:
  - job: BuildFrontendBackend
    displayName: "Build Frontend and Backend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        versionSpec: "18.x"

    - script: |
        node --version
        npm --version
      displayName: "Verify Node Installation"