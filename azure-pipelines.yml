trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: "Build FlavorForge Application"

  jobs:

  - job: BackendBuild
    displayName: "Build Backend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "22.x"

    - script: |
        cd backend
        npm ci
      displayName: "Install Backend Dependencies"

    - script: |
        cd backend
        npm test
      displayName: "Run Backend Validation"


  - job: FrontendBuild
    displayName: "Build Frontend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "22.x"

    - script: |
        cd frontend
        npm ci
      displayName: "Install Frontend Dependencies"

    - script: |
        cd frontend
        npm run build
      displayName: "Build React Application"

- stage: Test
  displayName: "Test and Quality Validation"
  dependsOn: Build

  jobs:

  - job: BackendSmokeTest
    displayName: "Backend API Smoke Test"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"

    - script: |
        cd backend
        npm ci
      displayName: "Install Backend Dependencies"

    - script: |
        cd backend
        node src/server.js &
        sleep 10
        curl --fail http://localhost:3000/api/health
      displayName: "Verify Backend Health Endpoint"


  - job: FrontendValidation
    displayName: "Frontend Build Validation"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"

    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: "Validate Frontend Production Build"

- stage: Security
  displayName: "Security Validation"
  dependsOn: Test

  jobs:

  - job: DependencyScan
    displayName: "Node Dependency Security Scan"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"


    - script: |
        cd backend
        npm ci
        npm audit --audit-level=high
      displayName: "Backend Dependency Scan"


    - script: |
        cd frontend
        npm ci
        npm audit --audit-level=high
      displayName: "Frontend Dependency Scan"      