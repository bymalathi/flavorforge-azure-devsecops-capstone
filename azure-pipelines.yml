trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: "Build FlavorForge Application"

  jobs:

  - job: BackendBuild
    displayName: "Build Backend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "22.x"

    - script: |
        cd backend
        npm ci
      displayName: "Install Backend Dependencies"

    - script: |
        cd backend
        npm test
      displayName: "Run Backend Validation"


  - job: FrontendBuild
    displayName: "Build Frontend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "22.x"

    - script: |
        cd frontend
        npm ci
      displayName: "Install Frontend Dependencies"

    - script: |
        cd frontend
        npm run build
      displayName: "Build React Application"

- stage: Test
  displayName: "Test and Quality Validation"
  dependsOn: Build

  jobs:

  - job: BackendSmokeTest
    displayName: "Backend API Smoke Test"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"

    - script: |
        cd backend
        npm ci
      displayName: "Install Backend Dependencies"

    - script: |
        cd backend
        node src/server.js &
        sleep 10
        curl --fail http://localhost:3000/api/health
      displayName: "Verify Backend Health Endpoint"


  - job: FrontendValidation
    displayName: "Frontend Build Validation"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"

    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: "Validate Frontend Production Build"

- stage: Security
  displayName: "Security Validation"
  dependsOn: Test

  jobs:

  - job: DependencyScan
    displayName: "Node Dependency Security Scan"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js 22 LTS"
      inputs:
        version: "22.x"


    - script: |
        cd backend
        npm ci --ignore-scripts
        npm audit --audit-level=high
      displayName: "Backend Dependency Scan"


    - script: |
        cd frontend
        npm ci --ignore-scripts
        npm audit --audit-level=high
      displayName: "Frontend Dependency Scan"      

- stage: CodeQuality
  displayName: "SonarQube Cloud Code Quality Analysis"

  dependsOn: Build

  jobs:

  - job: SonarScan
    displayName: "Run SonarQube Cloud Scan"

    steps:

    - checkout: self


    - task: SonarQubeCloudPrepare@3
      displayName: "Prepare SonarQube Cloud Analysis"

      inputs:
        SonarQubeCloud: 'flavorforge-sonarcloud-sc'
        organization: 'malathi-shetty'
        scannerMode: 'cli'
        configMode: 'manual'

        cliProjectKey: 'shettymalathib_flavorforge-azure-devsecops-capstone'

        cliProjectName: 'FlavorForge'


    - task: SonarQubeCloudAnalyze@3
      displayName: "Run SonarQube Cloud Analysis"


    - task: SonarQubeCloudPublish@3
      displayName: "Publish Quality Gate Result"

      inputs:
        pollingTimeoutSec: '300'