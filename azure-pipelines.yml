trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: "Build FlavorForge Application"

  jobs:

  - job: BackendBuild
    displayName: "Build Backend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "18.x"

    - script: |
        cd backend
        npm ci
      displayName: "Install Backend Dependencies"

    - script: |
        cd backend
        npm test
      displayName: "Run Backend Validation"


  - job: FrontendBuild
    displayName: "Build Frontend"

    steps:

    - checkout: self

    - task: UseNode@1
      displayName: "Install Node.js"
      inputs:
        version: "18.x"

    - script: |
        cd frontend
        npm ci
      displayName: "Install Frontend Dependencies"

    - script: |
        cd frontend
        npm run build
      displayName: "Build React Application"