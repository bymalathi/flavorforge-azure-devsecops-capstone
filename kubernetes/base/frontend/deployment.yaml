apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: flavorforge

  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      automountServiceAccountToken: false
      
      containers:
        - name: frontend

          image: flavorforgeacr2026ms.azurecr.io/flavorforge-frontend:1.0

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
